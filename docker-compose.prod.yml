version: '3.8'

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    env_file:
      - .env
    command: node dist/index.js

  frontend:
    build:
      context: ./apps/frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    # Assuming the frontend Dockerfile uses Nginx to serve the static files

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  default:
    name: masterdash_net

volumes:
  mongo_data:
  redis_data:
