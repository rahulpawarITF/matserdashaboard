name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-typecheck-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/backend/package-lock.json'
      - name: Install Dependencies
        working-directory: apps/backend
        run: npm ci
      - name: Typecheck
        working-directory: apps/backend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: apps/backend
        run: npm run lint --if-present

  lint-and-typecheck-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package-lock.json'
      - name: Install Dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Typecheck
        working-directory: apps/frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: apps/frontend
        run: npm run lint --if-present

  test-backend:
    needs: lint-and-typecheck-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/backend/package-lock.json'
      - name: Install Dependencies
        working-directory: apps/backend
        run: npm ci
      - name: Test
        working-directory: apps/backend
        run: npx jest --coverage --passWithNoTests
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage/

  test-frontend:
    needs: lint-and-typecheck-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package-lock.json'
      - name: Install Dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Test
        working-directory: apps/frontend
        run: npx vitest run --coverage --passWithNoTests

  build-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/backend/package-lock.json'
      - name: Install Dependencies
        working-directory: apps/backend
        run: npm ci
      - name: Build
        working-directory: apps/backend
        run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist/

  build-frontend:
    needs: test-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package-lock.json'
      - name: Install Dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Build
        working-directory: apps/frontend
        run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist/

  docker-build:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          push: false
          tags: masterdashboard-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: false
          tags: masterdashboard-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
